[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tavernlens"
version = "0.1.4"
description = "Lightweight Chinese Battlegrounds hero and trinket stats overlay"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
tavernlens = "tavernlens.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tavernlens = ["data/*.json"]
